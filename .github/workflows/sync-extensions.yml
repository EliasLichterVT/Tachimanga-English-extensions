
name: Sync extension repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: curated-extension-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Build three curated catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build separate catalogs
        run: |
          python3 scripts/build_catalogs.py

      - name: Publish catalogs
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            keiyoushi/ \
            cursed/ \
            manti/

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update three curated catalogs"
          git push origin HEAD:main
