
name: Sync extension repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: extension-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update Tachimanga extensions
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download extension repository
        run: |
          set -euo pipefail

          echo "Cloning upstream extension repository..."

          git clone \
            --depth 1 \
            --single-branch \
            --branch repo \
            https://github.com/keiyoushi/extensions.git \
            /tmp/upstream

          echo "Upstream repository cloned."
          echo "Files found:"

          ls -lah /tmp/upstream

          echo "Checking required files..."

          for path in index.pb repo.json apk; do
            if [ ! -e "/tmp/upstream/$path" ]; then
              echo "::error::Missing upstream path: $path"
              exit 1
            fi
          done

          echo "Required upstream files verified."

      - name: Synchronize extension files
        run: |
          set -euo pipefail

          echo "Synchronizing extension files..."

          mkdir -p apk

          cp /tmp/upstream/index.pb ./index.pb
          cp /tmp/upstream/repo.json ./repo.json

          for file in index.json index.min.json; do
            if [ -f "/tmp/upstream/$file" ]; then
              cp "/tmp/upstream/$file" "./$file"
            fi
          done

          rsync -a --delete \
            /tmp/upstream/apk/ ./apk/

          if [ -d /tmp/upstream/icon ]; then
            mkdir -p icon
            rsync -a --delete \
              /tmp/upstream/icon/ ./icon/
          fi

          echo "Extension synchronization complete."

      - name: Verify synchronized files
        run: |
          set -euo pipefail

          echo "Verifying repository contents..."

          test -s index.pb
          test -s repo.json
          test -d apk

          echo "Repository files verified."
          ls -lh index.pb repo.json

      - name: Commit and publish updates
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No extension updates available."
            exit 0
          fi

          echo "Publishing extension updates..."

          git commit -m "Update Tachimanga extensions"
          git push origin HEAD:main

          echo "Repository updated successfully."
