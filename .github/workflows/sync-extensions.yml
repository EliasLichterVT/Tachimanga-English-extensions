
name: Sync extension repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: extension-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update Tachimanga extensions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download upstream repository
        run: |
          set -euo pipefail

          echo "Downloading Keiyoushi extension metadata..."

          git clone \
            --depth 1 \
            --single-branch \
            --branch repo \
            https://github.com/keiyoushi/extensions.git \
            /tmp/upstream

          echo "Upstream repository downloaded."
          ls -lah /tmp/upstream

      - name: Verify upstream files
        run: |
          set -euo pipefail

          for file in index.pb repo.json; do
            if [ ! -s "/tmp/upstream/$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          echo "Required files verified."

      - name: Synchronize repository files
        run: |
          set -euo pipefail

          echo "Synchronizing extension metadata..."

          cp /tmp/upstream/index.pb ./index.pb
          cp /tmp/upstream/repo.json ./repo.json

          for file in \
            index.json \
            index.min.json \
            index.html \
            release-assets.json; do

            if [ -f "/tmp/upstream/$file" ]; then
              cp "/tmp/upstream/$file" "./$file"
              echo "Updated $file"
            fi

          done

          if [ -d /tmp/upstream/icon ]; then
            mkdir -p icon

            rsync -a --delete \
              /tmp/upstream/icon/ ./icon/

            echo "Updated extension icons."
          fi

          echo "Synchronization completed."

      - name: Verify synchronized repository
        run: |
          set -euo pipefail

          test -s index.pb
          test -s repo.json

          echo "Repository verification successful."
          ls -lh index.pb repo.json

      - name: Commit and publish updates
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.pb \
            repo.json

          for path in \
            index.json \
            index.min.json \
            index.html \
            release-assets.json \
            icon; do

            if [ -e "$path" ]; then
              git add -A -- "$path"
            fi

          done

          if git diff --cached --quiet; then
            echo "Repository already up to date."
            exit 0
          fi

          git commit -m "Update Tachimanga extensions"
          git push origin HEAD:main

          echo "Repository published successfully."
