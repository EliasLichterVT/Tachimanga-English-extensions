
name: Sync extension repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: curated-extension-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update curated extensions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download upstream catalog
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --single-branch \
            --branch repo \
            https://github.com/keiyoushi/extensions.git \
            /tmp/upstream

          test -s /tmp/upstream/index.pb
          test -s /tmp/upstream/index.json
          test -s /tmp/upstream/repo.json

      - name: Build curated catalog
        run: |
          python3 scripts/filter_extensions.py \
            /tmp/upstream .

      - name: Publish changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            index.pb \
            index.json \
            repo.json \
            curated-report.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update curated extensions"
          git push origin HEAD:main
